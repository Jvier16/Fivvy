<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soporte — fivvy.</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0f0f;--paper:#f7f6f2;--cream:#eeecea;--line:#e0ddd8;
  --muted:#8a8680;--green:#1a7a4a;--font:'Outfit',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line);flex-shrink:0}
.logo{font-size:1.3rem;font-weight:700;text-decoration:none;color:var(--ink)}
.logo em{font-style:normal;font-weight:300;color:var(--muted)}
.back{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-decoration:none}

/* CHAT CONTAINER */
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:680px;width:100%;margin:0 auto;padding:0 1rem}
.messages{flex:1;overflow-y:auto;padding:1.5rem 0;display:flex;flex-direction:column;gap:1rem}

/* MESSAGES */
.msg{display:flex;gap:.75rem;align-items:flex-start;animation:fadeIn .2s ease}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;font-family:var(--mono)}
.avatar.bot{background:var(--ink);color:var(--paper)}
.avatar.user{background:var(--cream);color:var(--ink);border:1px solid var(--line)}
.bubble{max-width:75%;padding:.75rem 1rem;border-radius:12px;font-size:.875rem;line-height:1.6}
.bubble.bot{background:var(--paper);border:1px solid var(--line);border-radius:4px 12px 12px 12px}
.bubble.user{background:var(--ink);color:var(--paper);border-radius:12px 4px 12px 12px}

/* TYPING */
.typing{display:flex;gap:4px;align-items:center;padding:.75rem 1rem}
.typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

/* SUGGESTIONS */
.suggestions{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.sug{background:none;border:1px solid var(--line);border-radius:999px;padding:.4rem .85rem;font-family:var(--font);font-size:.78rem;color:var(--ink);cursor:pointer;transition:all .15s}
.sug:hover{border-color:var(--ink);background:var(--cream)}

/* INPUT */
.input-wrap{border-top:1px solid var(--line);padding:1rem 0 1.5rem;flex-shrink:0}
.input-row{display:flex;gap:.6rem;align-items:flex-end}
.inp{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.65rem .9rem;font-family:var(--font);font-size:.875rem;color:var(--ink);outline:none;resize:none;line-height:1.5;max-height:120px;transition:border-color .15s}
.inp:focus{border-color:var(--ink)}
.inp::placeholder{color:var(--muted)}
.send-btn{background:var(--ink);color:var(--paper);border:none;border-radius:8px;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.send-btn:hover{opacity:.8}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.send-btn svg{width:16px;height:16px;fill:currentColor}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="/">fivvy<em>.</em></a>
  <a class="back" href="/">← Volver a la app</a>
</nav>

<div class="chat-wrap">
  <div class="messages" id="messages"></div>

  <div class="suggestions" id="suggestions">
    <button class="sug" onclick="sendSuggestion(this)">¿Cómo cancelo mi suscripción?</button>
    <button class="sug" onclick="sendSuggestion(this)">¿Cómo solicito un reembolso?</button>
    <button class="sug" onclick="sendSuggestion(this)">¿Qué incluye el plan Pro?</button>
    <button class="sug" onclick="sendSuggestion(this)">Mis datos no se guardan</button>
    <button class="sug" onclick="sendSuggestion(this)">¿En qué países está disponible?</button>
  </div>

  <div class="input-wrap">
    <div class="input-row">
      <textarea class="inp" id="inp" placeholder="Escribe tu pregunta..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const SYSTEM = `Eres el asistente de soporte de fivvy, una app de finanzas personales para usuarios latinoamericanos. Tu nombre es Fivi.

Sobre fivvy:
- Es una PWA (app web instalable) de finanzas personales
- Tiene plan Free (gratis, básico) y plan Pro ($9.99/mes o $95.88/año)
- El plan Pro incluye: reportes avanzados, metas de ahorro, exportar PDF/Excel, presupuestos personalizados, insights con IA
- Los datos se guardan localmente en el dispositivo del usuario (localStorage)
- Disponible en fivvy.it.com para cualquier país hispanohablante
- Los pagos se procesan de forma segura

Política de reembolso: 7 días de garantía en el primer pago. Las renovaciones no tienen reembolso.
Cancelación: el usuario puede cancelar desde su cuenta en el procesador de pagos antes de la fecha de renovación.

Instrucciones:
- Responde siempre en español, de forma amable, clara y concisa
- Máximo 3-4 oraciones por respuesta
- Si no sabes algo específico, ofrece contactar soporte por email
- No inventes información que no tienes
- Si el problema es técnico complejo, sugiere borrar caché o reinstalar la app`;

let history = [];
let isLoading = false;

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const initials = role === 'bot' ? 'Fi' : 'Tú';
  div.innerHTML = `
    <div class="avatar ${role}">${initials}</div>
    <div class="bubble ${role}">${text}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = `
    <div class="avatar bot">Fi</div>
    <div class="bubble bot typing"><span></span><span></span><span></span></div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendSuggestion(btn) {
  const text = btn.textContent;
  document.getElementById('suggestions').style.display = 'none';
  processMessage(text);
}

function sendMessage() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text || isLoading) return;
  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('suggestions').style.display = 'none';
  processMessage(text);
}

async function processMessage(text) {
  addMessage('user', text);
  history.push({ role: 'user', content: text });

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  addTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Lo siento, hubo un error. Por favor intenta de nuevo.';

    removeTyping();
    addMessage('bot', reply);
    history.push({ role: 'assistant', content: reply });

  } catch(e) {
    removeTyping();
    addMessage('bot', 'Lo siento, no pude conectarme en este momento. Por favor intenta de nuevo en unos segundos.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('inp').focus();
}

// Mensaje de bienvenida
window.onload = () => {
  addMessage('bot', '¡Hola! Soy Fivi, el asistente de soporte de fivvy. ¿En qué puedo ayudarte hoy?');
};
</script>
</body>
</html>
